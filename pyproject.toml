[project]
name = "ton-payment"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexey Kozlouskiy",email = "bylba4kaa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.3,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "faststream[rabbit,cli] (>=0.7.7,<0.8.0)",
    "pytoniq (>=0.1.43,<0.2.0)",
    "toncenter (>=0.4.0,<0.5.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.10,<0.17.0)",
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py313"
extend-exclude = ["pyproject.toml"]

[tool.ruff.lint]
ignore = [
    "D102",
    "D103",
    "D100",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D212",
    "RUF001",
    "TD002",
    "TD003",
    "PLR0913",
    "CPY001",
    "COM812",
]
select = ["ALL"]
fixable = ["ALL"]
extend-safe-fixes = [
    "D",
    "E",
    "RUF",
    "EM",
    "TC",
    "FAST",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["INP001", "D205", "ERA001"]

[tool.mypy]
packages = ["ton_payment"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
